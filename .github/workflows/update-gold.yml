name: Update gold spot snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *' # Twice hourly; GitHub may delay scheduled jobs.
permissions:
  contents: write
concurrency:
  group: gold-snapshot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch spot and FX data
        run: python scripts_fetch.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update gold spot snapshot"
            git push
          else
            echo "No changes to commit"
          fi
          
